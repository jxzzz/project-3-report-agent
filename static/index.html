<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报告代理 · Multi-Agent Report Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<style>
:root {
  --bg: #EDF0F5;
  --panel: #FBFCFE;
  --ink: #152238;
  --muted: #5C6B84;
  --line: #C9D3E1;
  --planner: #6D5AE0;
  --data: #0E7C86;
  --writer: #B4690E;
  --reviewer: #C2456B;
  --gate: #2E7D4F;
  --error: #C84343;
  --console-bg: #111A2C;
  --console-ink: #D8E1F0;
  --console-dim: #7A869E;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, "Noto Sans SC", monospace;
  --display: "Space Grotesk", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --body: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px),
                    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 48px 48px;
  background-position: -1px -1px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 80% 55% at 50% -5%, rgba(255,255,255,.75), transparent 70%);
  pointer-events: none; z-index: 0;
}
main { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 28px 20px 64px; }

/* ---------- header ---------- */
header.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
header.top h1 { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: .02em; }
header.top .lat {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .18em;
}
header.top .spacer { flex: 1; }
header.top a.docs {
  font-family: var(--mono); font-size: 12px; color: var(--data);
  text-decoration: none; border-bottom: 1px dashed var(--data); padding-bottom: 1px;
}
header.top a.docs:hover { color: var(--ink); border-color: var(--ink); }

/* ---------- composer ---------- */
.composer {
  display: flex; gap: 10px; align-items: stretch;
  background: var(--panel); border: 1.5px solid var(--ink);
  border-radius: 10px; padding: 10px; box-shadow: 4px 4px 0 rgba(21,34,56,.14);
}
.composer textarea {
  flex: 1; border: none; outline: none; resize: none; background: transparent;
  font-family: var(--body); font-size: 15px; color: var(--ink); line-height: 1.55;
  padding: 8px 10px; min-height: 52px; max-height: 160px;
}
.composer textarea::placeholder { color: var(--muted); }
.composer button {
  align-self: flex-end;
  font-family: var(--display); font-weight: 700; font-size: 14.5px; letter-spacing: .04em;
  color: #fff; background: var(--ink); border: none; border-radius: 8px;
  padding: 11px 22px; cursor: pointer; transition: transform .12s ease, background .15s;
  white-space: nowrap;
}
.composer button:hover:not(:disabled) { background: #24385C; transform: translateY(-1px); }
.composer button:active:not(:disabled) { transform: translateY(0); }
.composer button:disabled { opacity: .55; cursor: not-allowed; }
.composer button:focus-visible, .composer textarea:focus-visible,
.chip:focus-visible, summary:focus-visible {
  outline: 2px solid var(--planner); outline-offset: 2px;
}
.examples { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 2px 0; align-items: center; }
.examples .lab { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .12em; }
.chip {
  font-size: 12.5px; color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
  cursor: pointer; font-family: var(--body); transition: all .15s;
}
.chip:hover { color: var(--ink); border-color: var(--ink); background: var(--panel); }

/* ---------- pipeline rail ---------- */
.rail {
  display: flex; align-items: flex-start; gap: 0;
  margin: 26px 0 20px; padding: 18px 8px 14px;
  overflow-x: auto; scrollbar-width: thin;
}
.stage { display: flex; align-items: flex-start; flex: 0 0 auto; }
.stage .node { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 88px; }
.stage .dot {
  width: 38px; height: 38px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--panel);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--muted);
  transition: all .3s ease; position: relative;
}
.stage .nm { font-size: 13.5px; font-weight: 600; color: var(--muted); transition: color .3s; }
.stage .en {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em;
  color: var(--muted); opacity: .7; text-transform: uppercase;
}
.link { width: 74px; height: 2px; background: var(--line); margin: 18px 6px 0; border-radius: 1px; position: relative; overflow: hidden; }
.link::after {
  content: ""; position: absolute; inset: 0; width: 0;
  background: var(--lit, var(--ink)); transition: width .45s ease;
}
.link.lit::after { width: 100%; }

.stage[data-state="active"] .dot { border-color: var(--hue); color: #fff; background: var(--hue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--hue) 22%, transparent); animation: breathe 1.6s ease-in-out infinite; }
.stage[data-state="active"] .nm { color: var(--hue); }
.stage[data-state="done"] .dot { border-color: var(--hue); color: var(--hue); background: color-mix(in srgb, var(--hue) 10%, var(--panel)); }
.stage[data-state="done"] .nm { color: var(--ink); }
.stage[data-state="done"] .dot::after { content: "✓"; position: absolute; right: -3px; bottom: -4px; font-size: 11px; color: var(--hue); background: var(--bg); border-radius: 50%; padding: 0 1px; }
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--hue) 22%, transparent); }
  50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--hue) 8%, transparent); }
}

/* ---------- panes ---------- */
.panes { display: grid; grid-template-columns: minmax(340px, 5fr) minmax(420px, 7fr); gap: 18px; align-items: start; }

/* ---------- console ---------- */
.console {
  background: var(--console-bg); border-radius: 12px; overflow: hidden;
  box-shadow: 5px 5px 0 rgba(21,34,56,.16); border: 1.5px solid #0A1120;
}
.console .bar {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  border-bottom: 1px solid #22304A;
}
.console .bar .tt { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--console-dim); }
.console .bar .live { margin-left: auto; display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--console-dim); }
.console .bar .live i { width: 7px; height: 7px; border-radius: 50%; background: #3A4A68; display: inline-block; }
.console.running .bar .live i { background: #5BE0A0; animation: blink 1.1s steps(2) infinite; }
.console.failed .bar .live i { background: var(--error); }
@keyframes blink { 50% { opacity: .3; } }
.console .feed {
  font-family: var(--mono); font-size: 12.5px; line-height: 1.75;
  color: var(--console-ink); padding: 14px 16px; height: 480px;
  overflow-y: auto; scroll-behavior: smooth;
}
.console .feed .t { color: var(--console-dim); margin-right: 8px; user-select: none; }
.ln { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
.ln.dim { color: var(--console-dim); }
.ln.err { color: #F08A8A; }
.ln.ok b { color: #7FD1AE; }
.ln .tag { display: inline-block; min-width: 74px; font-weight: 500; }
.ln details { display: inline-block; width: 100%; }
.ln summary { cursor: pointer; list-style: none; }
.ln summary::-webkit-details-marker { display: none; }
.ln summary::before { content: "▸ "; color: var(--console-dim); }
.ln details[open] summary::before { content: "▾ "; }
.ln pre.sql {
  margin: 6px 0 8px; padding: 8px 12px; background: #0A1120; color: #9FB4D8;
  border-left: 2px solid #2C3E60; border-radius: 0 6px 6px 0;
  overflow-x: auto; font-size: 11.5px; white-space: pre-wrap; word-break: break-all;
}
.feed .idle { color: var(--console-dim); }

/* ---------- report pane ---------- */
.report-wrap { display: flex; flex-direction: column; gap: 14px; }
.report {
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 30px 34px; min-height: 420px; box-shadow: 5px 5px 0 rgba(21,34,56,.07);
}
.report .empty { display: flex; flex-direction: column; gap: 12px; justify-content: center; min-height: 360px; color: var(--muted); }
.report .empty .big { font-family: var(--display); font-size: 17px; font-weight: 700; color: var(--ink); }
.report .empty p { font-size: 13.5px; max-width: 34em; }
.report .empty .flowline { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; }
.report .empty .flowline b { font-weight: 500; }
.fp { color: var(--planner); } .fd { color: var(--data); } .fw { color: var(--writer); }
.fr { color: var(--reviewer); } .fg { color: var(--gate); }

.notice {
  border-left: 4px solid var(--writer); background: #FDF6EA;
  border-radius: 0 8px 8px 0; padding: 16px 20px; font-size: 14px;
}
.notice.bad { border-color: var(--error); background: #FBEEEE; }
.notice .t { font-family: var(--display); font-weight: 700; margin-bottom: 6px; }

/* markdown */
.md h1 { font-family: var(--display); font-size: 25px; line-height: 1.35; margin: 0 0 18px; letter-spacing: .01em; }
.md h2 {
  font-family: var(--display); font-size: 18px; margin: 30px 0 12px; padding-bottom: 7px;
  border-bottom: 1.5px solid var(--line); letter-spacing: .02em;
}
.md h2::before { content: "§ "; color: var(--data); font-weight: 500; }
.md h3 { font-size: 15.5px; margin: 20px 0 8px; }
.md p { margin: 10px 0; }
.md ul, .md ol { margin: 10px 0 10px 1.6em; }
.md li { margin: 5px 0; }
.md strong { font-weight: 700; }
.md table { border-collapse: collapse; margin: 16px 0; width: 100%; font-size: 13.5px; }
.md th {
  font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
  text-align: left; padding: 8px 12px; background: var(--bg); border: 1px solid var(--line); color: var(--muted);
}
.md td { padding: 8px 12px; border: 1px solid var(--line); }
.md tr:nth-child(even) td { background: rgba(237,240,245,.45); }
.md hr { border: none; border-top: 1.5px dashed var(--line); margin: 26px 0; }
.md code { font-family: var(--mono); font-size: .88em; background: var(--bg); padding: 1px 6px; border-radius: 4px; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 14px; color: var(--muted); margin: 12px 0; }
.md pre { background: var(--console-bg); color: var(--console-ink); padding: 14px 16px; border-radius: 8px; overflow-x: auto; margin: 14px 0; }
.md pre code { background: none; color: inherit; padding: 0; }
.cite {
  font-family: var(--mono); font-size: 11.5px; color: var(--data);
  border: 1px solid color-mix(in srgb, var(--data) 45%, transparent);
  background: color-mix(in srgb, var(--data) 7%, transparent);
  border-radius: 999px; padding: 0 8px; margin: 0 2px; white-space: nowrap;
}

/* stats */
.stats {
  display: none; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px;
  background: var(--line); border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden;
}
.stats.show { display: grid; }
.stats .st { background: var(--panel); padding: 10px 14px; }
.stats .st.wide { grid-column: 1 / -1; }
.stats .st.wide .v { font-size: 13px; }
.stats .st .k { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stats .st .v { font-family: var(--mono); font-size: 16px; font-weight: 500; color: var(--ink); }
.stats .st .v small { font-size: 11px; color: var(--muted); font-weight: 400; }

@media (max-width: 900px) {
  .panes { grid-template-columns: 1fr; }
  .console .feed { height: 300px; }
  .report { padding: 22px 20px; }
  main { padding: 20px 14px 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .console .feed { scroll-behavior: auto; }
}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>报告代理</h1>
    <span class="lat">Multi-Agent Report Console</span>
    <span class="spacer"></span>
    <a class="docs" href="/docs" target="_blank" rel="noopener">API 文档 ↗</a>
  </header>

  <section class="composer-wrap" aria-label="提问">
    <div class="composer">
      <textarea id="q" rows="2" placeholder="输入一个数据问题，例如：分析 2026 年 8 月的销售情况……（Ctrl/⌘ + Enter 提交）" aria-label="数据问题"></textarea>
      <button id="go">生成报告</button>
    </div>
    <div class="examples">
      <span class="lab">试试：</span>
      <button class="chip">2026年8月的总销售额和订单量是多少？</button>
      <button class="chip">2026年8月消费金额最高的前三位客户是谁？</button>
      <button class="chip">2026年8月退款率最高的商品是什么？</button>
      <button class="chip">客户的满意度评分是多少？（会被拒答）</button>
    </div>
  </section>

  <nav class="rail" id="rail" aria-label="Agent 流水线">
    <div class="stage s-planner" data-node="planner" data-state="pending" style="--hue:var(--planner)">
      <div class="node"><span class="dot">01</span><span class="nm">规划</span><span class="en">Plan</span></div>
    </div>
    <div class="link" data-after="planner" style="--lit:var(--planner)"></div>
    <div class="stage s-data" data-node="data_agent" data-state="pending" style="--hue:var(--data)">
      <div class="node"><span class="dot">02</span><span class="nm">取数</span><span class="en">Query</span></div>
    </div>
    <div class="link" data-after="data_agent" style="--lit:var(--data)"></div>
    <div class="stage s-writer" data-node="writer" data-state="pending" style="--hue:var(--writer)">
      <div class="node"><span class="dot">03</span><span class="nm">写作</span><span class="en">Write</span></div>
    </div>
    <div class="link" data-after="writer" style="--lit:var(--writer)"></div>
    <div class="stage s-reviewer" data-node="reviewer" data-state="pending" style="--hue:var(--reviewer)">
      <div class="node"><span class="dot">04</span><span class="nm">审查</span><span class="en">Review</span></div>
    </div>
    <div class="link" data-after="reviewer" style="--lit:var(--reviewer)"></div>
    <div class="stage s-gate" data-node="human_gate" data-state="pending" style="--hue:var(--gate)">
      <div class="node"><span class="dot">05</span><span class="nm">放行</span><span class="en">Release</span></div>
    </div>
  </nav>

  <div class="panes">
    <section class="console" id="console" aria-label="事件流">
      <div class="bar">
        <span class="tt">事件流 / event stream</span>
        <span class="live"><i></i><span id="liveText">待机</span></span>
      </div>
      <div class="feed" id="feed" role="log" aria-live="polite">
        <div class="ln dim idle">等待任务。提交问题后，这里会实时显示每个 Agent 的动作。</div>
      </div>
    </section>

    <section class="report-wrap" aria-label="报告">
      <div class="report" id="report">
        <div class="empty" id="emptyState">
          <span class="big">报告将显示在这里</span>
          <p class="flowline">
            <b class="fp">规划</b> → <b class="fd">取数</b> → <b class="fw">写作</b> → <b class="fr">审查</b> → <b class="fg">放行</b>
          </p>
          <p>五个 Agent 依次接力：先拆解你的问题，再执行只读 SQL 查询，写出带 <span class="cite">数据：dX</span> 引用的报告，经事实审查与硬校验通过后才放行。数据不足的提问会被明确拒答，而不是编造。</p>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </section>
  </div>
</main>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var qEl = $("q"), goEl = $("go"), feedEl = $("feed"), consoleEl = $("console"),
      reportEl = $("report"), statsEl = $("stats"), liveEl = $("liveText"), railEl = $("rail");

  var NODE_ORDER = ["planner", "data_agent", "writer", "reviewer", "human_gate"];
  var NODE_LABEL = { planner: "规划", data_agent: "取数", writer: "写作", reviewer: "审查", human_gate: "放行", blocked: "拦截" };
  var NODE_COLOR = { planner: "var(--planner)", data_agent: "var(--data)", writer: "var(--writer)", reviewer: "var(--reviewer)", human_gate: "var(--gate)", blocked: "var(--error)" };

  var running = false, t0 = 0, writerStarts = 0;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function elapsed() { return ((performance.now() - t0) / 1000).toFixed(1); }
  function nearBottom() { return feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 60; }
  function addLine(html, cls) {
    var idle = feedEl.querySelector(".idle");
    if (idle) idle.remove();
    var stick = nearBottom();
    var div = document.createElement("div");
    div.className = "ln" + (cls ? " " + cls : "");
    div.innerHTML = '<span class="t">+' + elapsed() + "s</span>" + html;
    feedEl.appendChild(div);
    if (stick) feedEl.scrollTop = feedEl.scrollHeight;
    return div;
  }
  function tag(node) {
    return '<b class="tag" style="color:' + (NODE_COLOR[node] || "inherit") + '">' + (NODE_LABEL[node] || node || "") + "</b>";
  }
  function setStage(node, state) {
    var el = railEl.querySelector('.stage[data-node="' + node + '"]');
    if (el) el.dataset.state = state;
  }
  function setLinkAfter(node, lit) {
    var el = railEl.querySelector('.link[data-after="' + node + '"]');
    if (el) el.classList.toggle("lit", lit);
  }
  function resetRail() {
    NODE_ORDER.forEach(function (n) { setStage(n, "pending"); setLinkAfter(n, false); });
  }

  /* ---------- markdown ---------- */
  function renderMarkdown(md) {
    var withCites = String(md).replace(/\[数据：([^\]\n]+)\]/g, '<span class="cite">数据：$1</span>');
    if (window.marked) {
      var html = marked.parse(withCites);
      if (window.DOMPurify) html = DOMPurify.sanitize(html);
      return { html: html };
    }
    return { text: md };
  }
  function mountRendered(target, out) {
    target.innerHTML = "";
    if (out.html != null) {
      var div = document.createElement("div");
      div.className = "md";
      div.innerHTML = out.html;
      target.appendChild(div);
    } else {
      var pre = document.createElement("pre");
      pre.className = "md";
      pre.style.whiteSpace = "pre-wrap";
      pre.textContent = out.text;
      target.appendChild(pre);
    }
  }

  /* ---------- events ---------- */
  function handleEvent(type, d) {
    d = d || {};
    if (type === "run_start") {
      addLine("任务启动 · <span style='color:var(--console-dim)'>request " + esc(d.request_id || "") + "</span>");
      addLine('“' + esc((d.data && d.data.question) || d.question || "") + "”");
    } else if (type === "node_start") {
      var node = d.node;
      var idx = NODE_ORDER.indexOf(node);
      if (node === "blocked") {
        addLine(tag(node) + " 进入拦截流程");
      } else {
        if (idx >= 0) {
          // 重写循环会让 writer 重新激活：把它之后的阶段退回等待
          NODE_ORDER.slice(idx).forEach(function (n, i) {
            setStage(n, i === 0 ? "active" : "pending");
            setLinkAfter(n, false);
          });
          NODE_ORDER.slice(0, idx).forEach(function (n) { setLinkAfter(n, true); });
        }
        var roundNote = "";
        if (node === "writer") {
          writerStarts += 1;
          if (writerStarts > 1) roundNote = "（第 " + writerStarts + " 轮重写）";
        }
        addLine(tag(node) + " 开始工作" + roundNote);
      }
    } else if (type === "node_end") {
      var n2 = d.node, dd = d.data || {};
      if (n2 === "blocked") {
        // 轨道保持真实状态（拦截发生处之后的节点从未运行）；
        // 失败信号由控制台状态灯与报告面板通知卡承担
        addLine(tag("blocked") + " " + esc(dd.reason || "流程终止"), "err");
      } else {
        setStage(n2, "done");
        setLinkAfter(n2, true);
        var brief = "";
        if (n2 === "planner") brief = dd.feasible ? "可行 · " + (dd.data_requirement_count || 0) + " 项数据需求" : "判定不可行";
        else if (n2 === "data_agent") brief = "成功 " + (dd.ok_count || 0) + " / 失败 " + (dd.failed_count || 0);
        else if (n2 === "writer") brief = (dd.draft_chars || 0) + " 字符草稿";
        else if (n2 === "reviewer") brief = dd.decision === "pass" ? "审查通过" : "要求修改（" + ((dd.issues || []).length) + " 个问题）";
        else if (n2 === "human_gate") brief = dd.status === "approved" ? "已放行" : "已拒绝";
        var cls = (n2 === "reviewer" && dd.decision !== "pass") ? "" : "ok";
        if (n2 === "reviewer" && dd.decision !== "pass") {
          addLine(tag(n2) + " <b style='color:#E8B45A'>要求修改</b> · " + esc(brief));
          (dd.issues || []).forEach(function (is) { addLine("&nbsp;&nbsp;· " + esc(is), "dim"); });
        } else {
          addLine(tag(n2) + " 完成 · " + esc(brief), cls);
        }
        if (n2 === "reviewer" && dd.decision !== "pass") {
          setStage("reviewer", "done");
        }
      }
    } else if (type === "sql_round_start") {
      addLine(tag("data_agent") + '<span style="color:var(--console-dim)">第 ' + (d.data.attempt || 1) + " 轮 SQL 生成 · 待查 " + esc((d.data.pending_ids || []).join(", ")) + "</span>");
    } else if (type === "sql_attempt") {
      var a = d.data || {};
      var mark = a.ok ? "<b>✓</b>" : "<b style='color:#F08A8A'>✗</b>";
      var head = mark + " <b>" + esc(a.requirement_id) + "</b> 第 " + (a.attempt || 1) + " 次" +
        (a.ok ? " · 返回 " + (a.row_count == null ? "?" : a.row_count) + " 行" : " · <span style='color:#F08A8A'>" + esc(a.error || "失败") + "</span>");
      var line = addLine(tag("data_agent") + head + (a.sql ? " <span style='color:var(--console-dim)'>SQL▾</span>" : ""), a.ok ? "ok" : "");
      if (a.sql) {
        var det = document.createElement("details");
        var sum = document.createElement("summary");
        sum.textContent = "查看 SQL";
        sum.style.color = "var(--console-dim)";
        var pre = document.createElement("pre");
        pre.className = "sql";
        pre.textContent = a.sql;
        det.appendChild(sum); det.appendChild(pre);
        line.appendChild(det);
      }
    } else if (type === "report_complete") {
      onComplete(d.data || {}, d.request_id);
    } else if (type === "error") {
      addLine("<b>运行失败</b> · " + esc(d.data && d.data.message || "未知错误"), "err");
      fail();
    }
  }

  function onComplete(data, requestId) {
    var status = data.status || "unknown";
    reportEl.innerHTML = "";
    if (status === "approved") {
      mountRendered(reportEl, renderMarkdown(data.report || ""));
      addLine("<b>报告已放行</b> · " + (data.total_tokens || 0) + " tokens · " + (data.latency_ms || 0) + " ms", "ok");
    } else {
      var card = document.createElement("div");
      card.className = "notice" + (status === "blocked" || status === "rejected" ? " bad" : "");
      var label = { blocked: "报告被拦截，未输出", rejected: "报告被拒绝", data_error: "数据查询失败" }[status] || ("结束（" + status + "）");
      card.innerHTML = '<div class="t">' + esc(label) + "</div><div>" + esc(data.report || "") + "</div>";
      reportEl.appendChild(card);
      addLine("<b>" + esc(label) + "</b>", "err");
      consoleEl.classList.add("failed");
      failLabel = status === "blocked" ? "拦截" : "结束";
      liveEl.textContent = failLabel;
    }
    statsEl.className = "stats show";
    statsEl.innerHTML = "";
    [
      ["状态", status, ""],
      ["耗时", ((data.latency_ms || 0) / 1000).toFixed(1), "s"],
      ["Tokens", data.total_tokens || 0, ""],
      ["模型调用", data.llm_calls || 0, "次"],
      ["审查轮次", data.review_round == null ? "–" : data.review_round, ""],
    ].forEach(function (row) {
      var st = document.createElement("div");
      st.className = "st";
      st.innerHTML = '<div class="k">' + esc(row[0]) + '</div><div class="v">' + esc(row[1]) + (row[2] ? " <small>" + esc(row[2]) + "</small>" : "") + "</div>";
      statsEl.appendChild(st);
    });
    var wide = document.createElement("div");
    wide.className = "st wide";
    wide.innerHTML = '<div class="k">Request</div><div class="v">' + esc(requestId || "–") + "</div>";
    statsEl.appendChild(wide);
    done(status === "approved");
  }

  var failLabel = null;
  function setRunning(on) {
    running = on;
    goEl.disabled = on;
    goEl.textContent = on ? "生成中…" : "生成报告";
    qEl.disabled = on;
    consoleEl.classList.toggle("running", on);
    consoleEl.classList.remove("failed");
    liveEl.textContent = on ? "运行中" : "待机";
  }
  function done(ok) {
    setRunning(false);
    liveEl.textContent = failLabel || (ok ? "完成" : "结束");
  }
  function fail(label) {
    failLabel = label || "失败";
    setRunning(false);
    consoleEl.classList.add("failed");
    liveEl.textContent = failLabel;
  }

  /* ---------- SSE over fetch ---------- */
  function handleFrame(frame) {
    var type = "message", dataLine = null;
    frame.split("\n").forEach(function (line) {
      if (line.indexOf("event:") === 0) type = line.slice(6).trim();
      else if (line.indexOf("data:") === 0) dataLine = line.slice(5).trim();
    });
    if (!dataLine) return;
    var payload;
    try { payload = JSON.parse(dataLine); } catch (e) { return; }
    handleEvent(type, payload);
  }

  async function run() {
    var question = qEl.value.trim();
    if (!question || running) return;

    feedEl.innerHTML = "";
    statsEl.className = "stats";
    statsEl.innerHTML = "";
    writerStarts = 0;
    failLabel = null;
    reportEl.innerHTML = '<div class="empty"><span class="big">报告将显示在这里</span><p>任务运行中，完成后自动呈现。</p></div>';
    resetRail();
    setRunning(true);
    t0 = performance.now();

    var resp;
    try {
      resp = await fetch("/report/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question, auto_approve: true }),
      });
    } catch (e) {
      addLine("<b>无法连接服务</b> · " + esc(e.message || e), "err");
      fail();
      return;
    }
    if (!resp.ok || !resp.body) {
      var detail = "";
      try { detail = (await resp.json()).detail || ""; } catch (e) {}
      addLine("<b>请求被拒绝（HTTP " + resp.status + "）</b>" + (detail ? " · " + esc(detail) : ""), "err");
      fail();
      return;
    }

    var reader = resp.body.getReader();
    var decoder = new TextDecoder("utf-8");
    var buf = "";
    try {
      while (true) {
        var r = await reader.read();
        if (r.done) break;
        buf += decoder.decode(r.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          var frame = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          if (frame.trim()) handleFrame(frame);
        }
      }
      if (buf.trim()) handleFrame(buf);
    } catch (e) {
      addLine("<b>流中断</b> · " + esc(e.message || e), "err");
      fail();
      return;
    }
    if (!statsEl.classList.contains("show")) done(false);
  }

  /* ---------- wiring ---------- */
  goEl.addEventListener("click", run);
  qEl.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
  });
  document.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      qEl.value = chip.textContent.replace(/（会被拒答）/, "").trim();
      qEl.focus();
    });
  });
})();
</script>
</body>
</html>
